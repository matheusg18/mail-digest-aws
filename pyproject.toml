[project]
name = "mail-digest-aws"
version = "0.1.0"
description = ""
authors = [{ name = "Matheus Santos", email = "matheusgabriel.18@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "supabase (>=2.15.3,<3.0.0)",
    "functions-framework (>=3.8.3,<4.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.dispatcher.dependencies]
google-cloud-pubsub = "^2.31.0"

[tool.poetry.group.worker.dependencies]
langchain = "^0.3.26"
langchain-core = "^0.3.68"
langchain-openai = "^0.3.27"
beautifulsoup4 = "^4.13.4"
cryptography = "^45.0.5"
google-cloud-pubsub = "^2.31.0"

[tool.poetry.group.telegram_webhook.dependencies]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-cov = "^6.1.1"
taskipy = "^1.14.1"
ruff = "^0.11.13"
pytest-asyncio = "^1.0.0"
factory-boy = "^3.3.3"
freezegun = "^1.5.2"
respx = "^0.22.0"
pytest-env = "^1.1.5"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
asyncio_default_fixture_loop_scope = 'function'
env = [
    "TELEGRAM_BOT_TOKEN=telegram-bot-token-test",
    "TELEGRAM_WEBHOOK_SECRET_TOKEN=telegram-webhook-secret-token-test",
    "SUPABASE_URL=http://test"
]

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
pre_test = 'task lint'
test = 'PYTHON_ENV=test pytest -s -x -vv'
post_test = 'coverage html'
clean = "rm -rf build/"
_build_dispatcher = """
mkdir -p build/dispatcher && \
cp -R functions/dispatcher/. build/dispatcher/ && \
cp -R shared/. build/dispatcher/shared/ && \
poetry export -f requirements.txt --only main,dispatcher -o build/dispatcher/requirements.txt --without-hashes
"""
_build_worker = """
mkdir -p build/worker && \
cp -R functions/worker/. build/worker/ && \
cp -R shared/. build/worker/shared/ && \
poetry export -f requirements.txt --only main,worker -o build/worker/requirements.txt --without-hashes
"""
_build_telegram_webhook = """
mkdir -p build/telegram_webhook && \
cp -R functions/telegram_webhook/. build/telegram_webhook/ && \
cp -R shared/. build/telegram_webhook/shared/ && \
poetry export -f requirements.txt --only main,telegram_webhook -o build/telegram_webhook/requirements.txt --without-hashes
"""
build = "task clean && task _build_dispatcher && task _build_worker && task _build_telegram_webhook"

[tool.coverage.run]
concurrency = ["thread", "greenlet"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
